<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#2A0E58" rx="80"/>

  <!-- Pride stripe at top -->
  <rect x="0" y="0" width="512" height="28" rx="0" fill="url(#pride)"/>
  <rect x="0" y="0" width="512" height="28" rx="80" fill="transparent"/>
  <!-- top-left corner fix -->
  <rect x="0" y="28" width="512" height="4" fill="#2A0E58"/>

  <!-- Pride stripe at bottom -->
  <rect x="0" y="484" width="512" height="28" fill="url(#pride)"/>

  <!-- Teacup body (pixel art style) -->
  <!-- Cup trapezoid -->
  <rect x="156" y="220" width="200" height="140" rx="8" fill="#B4A8E0"/>
  <!-- Cup narrower top -->
  <rect x="176" y="200" width="160" height="30" rx="6" fill="#C4B8F0"/>
  <!-- Saucer -->
  <rect x="126" y="360" width="260" height="20" rx="10" fill="#9D8FD6"/>
  <rect x="106" y="376" width="300" height="14" rx="7" fill="#B4A8E0"/>

  <!-- Handle -->
  <rect x="356" y="240" width="20" height="80" rx="10" fill="#9D8FD6"/>
  <rect x="340" y="236" width="40" height="16" rx="8" fill="#9D8FD6"/>
  <rect x="340" y="304" width="40" height="16" rx="8" fill="#9D8FD6"/>

  <!-- Steam wisps -->
  <rect x="220" y="152" width="10" height="36" rx="5" fill="#C4B8F0" opacity="0.7"/>
  <rect x="216" y="144" width="18" height="12" rx="6" fill="#C4B8F0" opacity="0.5"/>

  <rect x="252" y="136" width="10" height="50" rx="5" fill="#F06B9A" opacity="0.6"/>
  <rect x="248" y="128" width="18" height="12" rx="6" fill="#F06B9A" opacity="0.4"/>

  <rect x="284" y="148" width="10" height="38" rx="5" fill="#C4B8F0" opacity="0.7"/>
  <rect x="280" y="140" width="18" height="12" rx="6" fill="#C4B8F0" opacity="0.5"/>

  <!-- Shine on cup -->
  <rect x="180" y="226" width="8" height="40" rx="4" fill="white" opacity="0.15"/>

  <defs>
    <linearGradient id="pride" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ED8E89"/>
      <stop offset="20%"  stop-color="#F7B685"/>
      <stop offset="40%"  stop-color="#F3EBA5"/>
      <stop offset="60%"  stop-color="#94C691"/>
      <stop offset="80%"  stop-color="#9BD6D9"/>
      <stop offset="100%" stop-color="#B4A8E0"/>
    </linearGradient>
  </defs>
</svg>
