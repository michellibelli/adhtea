<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#2A0E58" rx="80"/>

  <!-- Pride stripe top (3x bigger) -->
  <rect x="0" y="0" width="512" height="72" fill="url(#pride)"/>
  <!-- Pride stripe bottom (3x bigger) -->
  <rect x="0" y="440" width="512" height="72" fill="url(#pride)"/>

  <!--
    "e" left edge centered at x=256
    At font-size 150, "T" width ≈ 82px
    "Tea" x = 256 - 82 = 174
    "adh" x = 256 (aligns with "e")
  -->

  <!-- "adh" — lavender, smaller -->
  <text
    x="256" y="278"
    font-family="Arial, Helvetica, sans-serif"
    font-size="146"
    font-weight="900"
    fill="#C4B8F0"
    letter-spacing="-2"
  >adh</text>

  <!-- "Tea" — white, larger, T hangs left of center -->
  <text
    x="174" y="418"
    font-family="Arial, Helvetica, sans-serif"
    font-size="150"
    font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-2"
  >Tea</text>

  <defs>
    <linearGradient id="pride" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ED8E89"/>
      <stop offset="20%"  stop-color="#F7B685"/>
      <stop offset="40%"  stop-color="#F3EBA5"/>
      <stop offset="60%"  stop-color="#94C691"/>
      <stop offset="80%"  stop-color="#9BD6D9"/>
      <stop offset="100%" stop-color="#B4A8E0"/>
    </linearGradient>
  </defs>
</svg>
