<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#2A0E58" rx="80"/>

  <!-- Pride stripe top -->
  <rect x="0" y="0" width="512" height="24" fill="url(#pride)"/>
  <!-- Pride stripe bottom -->
  <rect x="0" y="488" width="512" height="24" fill="url(#pride)"/>

  <!--
    Layout: "adh" sits above "ea" of "Tea"
      T
      Tea
    adh
    i.e. "T" hangs left, "adh" is above "ea"

    At font-size 148, bold sans-serif:
      "T" width ≈ 82px
    "Tea" starts at x=108  → "e" starts at ~190
    "adh" starts at x=190  → aligns above "ea"
  -->

  <!-- "adh" — lavender, above the "ea" -->
  <text
    x="190" y="270"
    font-family="Arial, Helvetica, sans-serif"
    font-size="148"
    font-weight="900"
    fill="#C4B8F0"
    letter-spacing="-2"
  >adh</text>

  <!-- "Tea" — white, offset left so T hangs out -->
  <text
    x="108" y="410"
    font-family="Arial, Helvetica, sans-serif"
    font-size="148"
    font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-2"
  >Tea</text>

  <defs>
    <linearGradient id="pride" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ED8E89"/>
      <stop offset="20%"  stop-color="#F7B685"/>
      <stop offset="40%"  stop-color="#F3EBA5"/>
      <stop offset="60%"  stop-color="#94C691"/>
      <stop offset="80%"  stop-color="#9BD6D9"/>
      <stop offset="100%" stop-color="#B4A8E0"/>
    </linearGradient>
  </defs>
</svg>
