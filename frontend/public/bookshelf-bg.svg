<svg xmlns="http://www.w3.org/2000/svg" width="540" height="420" viewBox="0 0 540 420">
  <defs>
    <style><![CDATA[
      /* 30s cycle per curio. Each animation has a ~2.5s active window
         (frames 0-8%) and stays static for the rest of the cycle.
         Negative animation-delays stagger the six curios by ~5s each
         so only one or two are moving at any given moment. */

      .curio { transform-box: fill-box; transform-origin: center; }

      @keyframes curio-hourglass {
        0%, 4% { transform: rotate(0deg); }
        6%     { transform: rotate(180deg); }
        8%     { transform: rotate(360deg); }
        100%   { transform: rotate(360deg); }
      }
      @keyframes curio-crystal {
        0%, 4% { transform: scale(1);     opacity: 1;   }
        6%     { transform: scale(1.18);  opacity: 0.85;}
        8%     { transform: scale(1);     opacity: 1;   }
        100%   { transform: scale(1);     opacity: 1;   }
      }
      @keyframes curio-mushroom {
        0%, 4% { transform: rotate(0deg); }
        5%     { transform: rotate(-10deg); }
        6%     { transform: rotate(10deg); }
        7%     { transform: rotate(-6deg); }
        8%     { transform: rotate(0deg); }
        100%   { transform: rotate(0deg); }
      }
      @keyframes curio-skull {
        0%, 4% { transform: scale(1); }
        5%     { transform: scale(1.08); }
        6%     { transform: scale(0.96); }
        7%     { transform: scale(1.04); }
        8%     { transform: scale(1); }
        100%   { transform: scale(1); }
      }
      @keyframes curio-telescope {
        0%, 4% { transform: rotate(0deg); }
        6%     { transform: rotate(-7deg); }
        8%     { transform: rotate(0deg); }
        100%   { transform: rotate(0deg); }
      }
      @keyframes curio-butterfly {
        0%, 4% { transform: scaleY(1); }
        5%     { transform: scaleY(0.35); }
        6%     { transform: scaleY(1); }
        7%     { transform: scaleY(0.35); }
        8%     { transform: scaleY(1); }
        100%   { transform: scaleY(1); }
      }

      .curio-hourglass { animation: curio-hourglass 30s ease-in-out infinite;  animation-delay:   0s; }
      .curio-crystal   { animation: curio-crystal   30s ease-in-out infinite;  animation-delay:  -5s; }
      .curio-mushroom  { animation: curio-mushroom  30s ease-in-out infinite;  animation-delay: -10s; }
      .curio-skull     { animation: curio-skull     30s ease-in-out infinite;  animation-delay: -15s; }
      .curio-telescope { animation: curio-telescope 30s ease-in-out infinite;  animation-delay: -20s; }
      .curio-butterfly { animation: curio-butterfly 30s ease-in-out infinite;  animation-delay: -25s; }
    ]]></style>
  </defs>

  <g opacity="0.24">

    <!-- ============ Shelf 1 (top), wood at y=140 ============ -->
    <rect x="0" y="140" width="540" height="8" fill="#7A5A30"/>
    <rect x="0" y="140" width="540" height="1.5" fill="#B89060"/>

    <!-- Books shelf 1 left cluster -->
    <rect x="12" y="65" width="16" height="75" fill="#586E75"/>
    <rect x="30" y="55" width="19" height="85" fill="#B04A1D"/>
    <rect x="51" y="75" width="13" height="65" fill="#2076B0"/>
    <rect x="66" y="50" width="20" height="90" fill="#1F857D"/>
    <rect x="88" y="70" width="15" height="70" fill="#A07A20"/>
    <rect x="105" y="60" width="17" height="80" fill="#5F62A8"/>
    <rect x="124" y="68" width="14" height="72" fill="#6A7838"/>

    <!-- Curio: Hourglass -->
    <g class="curio curio-hourglass">
      <g stroke="#586E75" stroke-width="1.2" fill="none">
        <line x1="150" y1="95" x2="176" y2="95"/>
        <line x1="150" y1="140" x2="176" y2="140"/>
        <path d="M 152 95 L 174 95 L 165 117 L 174 140 L 152 140 L 161 117 Z"/>
      </g>
      <path d="M 154 96 L 172 96 L 165 112 Z" fill="#A07A20" opacity="0.85" stroke="none"/>
      <path d="M 162 124 L 168 124 L 173 139 L 153 139 L 158 124 Z" fill="#A07A20" opacity="0.85" stroke="none"/>
    </g>

    <!-- Books mid -->
    <rect x="192" y="62" width="15" height="78" fill="#B04A1D"/>
    <rect x="209" y="52" width="18" height="88" fill="#586E75"/>
    <rect x="229" y="72" width="13" height="68" fill="#2076B0"/>
    <rect x="244" y="58" width="16" height="82" fill="#1F857D"/>
    <rect x="262" y="50" width="14" height="90" fill="#A07A20"/>

    <!-- Curio: Crystal ball on tripod stand -->
    <g class="curio curio-crystal">
      <circle cx="298" cy="110" r="14" fill="#8FB8D6" fill-opacity="0.45" stroke="#586E75" stroke-width="1.2"/>
      <path d="M 291 104 Q 296 101 301 104" stroke="#FDF6E3" stroke-width="1.1" fill="none" opacity="0.9"/>
      <line x1="290" y1="125" x2="285" y2="140" stroke="#7A5A30" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="306" y1="125" x2="311" y2="140" stroke="#7A5A30" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="298" y1="124" x2="298" y2="140" stroke="#7A5A30" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Books -->
    <rect x="325" y="65" width="15" height="75" fill="#5F62A8"/>
    <rect x="342" y="55" width="17" height="85" fill="#B04A1D"/>
    <rect x="361" y="70" width="14" height="70" fill="#2076B0"/>
    <rect x="377" y="62" width="16" height="78" fill="#A07A20"/>

    <!-- Curio: Glass dome over a small mushroom -->
    <g>
      <path d="M 405 124 Q 405 96 422 96 Q 439 96 439 124" fill="none" stroke="#586E75" stroke-width="1.2"/>
      <line x1="402" y1="124" x2="442" y2="124" stroke="#586E75" stroke-width="1.6" stroke-linecap="round"/>
      <g class="curio curio-mushroom">
        <rect x="420" y="111" width="4" height="13" fill="#FDF6E3" stroke="#586E75" stroke-width="0.7"/>
        <path d="M 414 111 Q 422 100 430 111 Z" fill="#B04A1D" fill-opacity="0.85"/>
        <circle cx="418" cy="107" r="0.9" fill="#FDF6E3"/>
        <circle cx="425" cy="106" r="0.9" fill="#FDF6E3"/>
      </g>
    </g>

    <!-- Books right -->
    <rect x="455" y="50" width="15" height="90" fill="#1F857D"/>
    <rect x="472" y="62" width="16" height="78" fill="#586E75"/>
    <rect x="490" y="55" width="14" height="85" fill="#B04A1D"/>
    <rect x="507" y="68" width="17" height="72" fill="#6A7838"/>


    <!-- ============ Shelf 2 (bottom), wood at y=320 ============ -->
    <rect x="0" y="320" width="540" height="8" fill="#7A5A30"/>
    <rect x="0" y="320" width="540" height="1.5" fill="#B89060"/>

    <!-- Books left -->
    <rect x="12" y="248" width="16" height="72" fill="#B04A1D"/>
    <rect x="30" y="238" width="18" height="82" fill="#586E75"/>
    <rect x="50" y="252" width="14" height="68" fill="#A07A20"/>
    <rect x="66" y="232" width="20" height="88" fill="#1F857D"/>

    <!-- Curio: Skull -->
    <g class="curio curio-skull">
      <g fill="none" stroke="#586E75" stroke-width="1.2">
        <path d="M 95 296 Q 95 270 110 270 Q 125 270 125 296 L 123 306 L 120 311 L 116 314 L 110 316 L 104 314 L 100 311 L 97 306 Z"/>
        <path d="M 108 316 L 108 320 M 112 316 L 112 320"/>
      </g>
      <circle cx="104" cy="288" r="3" fill="#586E75" opacity="0.85"/>
      <circle cx="116" cy="288" r="3" fill="#586E75" opacity="0.85"/>
      <path d="M 110 295 L 108 301 L 112 301 Z" fill="#586E75" opacity="0.85"/>
      <line x1="103" y1="310" x2="117" y2="310" stroke="#586E75" stroke-width="0.7" stroke-dasharray="1.4 1.2"/>
    </g>

    <!-- Books -->
    <rect x="140" y="244" width="15" height="76" fill="#5F62A8"/>
    <rect x="157" y="235" width="17" height="85" fill="#B04A1D"/>
    <rect x="176" y="250" width="13" height="70" fill="#2076B0"/>
    <rect x="191" y="240" width="16" height="80" fill="#A07A20"/>

    <!-- Curio: Brass telescope on small tripod -->
    <g class="curio curio-telescope">
      <g stroke="#586E75" stroke-width="1.1" fill="#D89A40" fill-opacity="0.55">
        <rect x="218" y="298" width="32" height="11"/>
        <rect x="250" y="299" width="14" height="9"/>
        <rect x="264" y="300" width="9" height="7"/>
      </g>
      <line x1="225" y1="309" x2="221" y2="320" stroke="#7A5A30" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="243" y1="309" x2="247" y2="320" stroke="#7A5A30" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- Books -->
    <rect x="285" y="240" width="14" height="80" fill="#6A7838"/>
    <rect x="301" y="246" width="17" height="74" fill="#586E75"/>
    <rect x="320" y="235" width="15" height="85" fill="#B04A1D"/>
    <rect x="337" y="250" width="13" height="70" fill="#2076B0"/>
    <rect x="352" y="240" width="16" height="80" fill="#5F62A8"/>

    <!-- Curio: Pinned butterfly in shadow box -->
    <g>
      <rect x="378" y="258" width="44" height="56" fill="#FDF6E3" fill-opacity="0.5" stroke="#586E75" stroke-width="1.2"/>
      <g class="curio curio-butterfly">
        <g fill="#586E75" opacity="0.75">
          <path d="M 400 286 Q 386 277 386 289 Q 386 299 400 296 Z"/>
          <path d="M 400 286 Q 414 277 414 289 Q 414 299 400 296 Z"/>
          <ellipse cx="400" cy="290" rx="1.2" ry="9"/>
        </g>
        <path d="M 400 280 Q 398 276 396 275 M 400 280 Q 402 276 404 275" stroke="#586E75" stroke-width="0.7" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Books right -->
    <rect x="438" y="242" width="15" height="78" fill="#1F857D"/>
    <rect x="455" y="232" width="18" height="88" fill="#586E75"/>
    <rect x="475" y="248" width="14" height="72" fill="#A07A20"/>
    <rect x="491" y="240" width="16" height="80" fill="#B04A1D"/>
    <rect x="509" y="245" width="14" height="75" fill="#5F62A8"/>
    <rect x="525" y="236" width="15" height="84" fill="#6A7838"/>

  </g>
</svg>
