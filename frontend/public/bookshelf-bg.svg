    <line x1="328" y1="226" x2="328" y2="219" stroke="#586E75" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="328" y1="226" x2="333" y2="228" stroke="#586E75" stroke-width="0.9" stroke-linecap="round"/>

