<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Pressed flower — layered translucent petals with irregular edges
       to simulate a dried flower flattened between pages. Watercolor
       feel comes from overlapping semi-transparent shapes with soft
       feathered edges via the blur filter. -->
  <defs>
    <filter id="wc">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <filter id="wc2">
      <feGaussianBlur stdDeviation="0.25"/>
    </filter>
  </defs>
  <g filter="url(#wc)">
    <!-- Back petals — broader, more faded -->
    <ellipse cx="16" cy="9" rx="4.5" ry="7" transform="rotate(-15 16 16)" fill="rgba(164,100,120,0.18)"/>
    <ellipse cx="22" cy="14" rx="7" ry="4" transform="rotate(25 16 16)" fill="rgba(155,125,184,0.16)"/>
    <ellipse cx="10" cy="14" rx="6.5" ry="3.8" transform="rotate(-20 16 16)" fill="rgba(164,100,120,0.15)"/>
    <ellipse cx="16" cy="22" rx="4" ry="6.5" transform="rotate(10 16 16)" fill="rgba(155,125,184,0.14)"/>
    <ellipse cx="20" cy="20" rx="5.5" ry="3.5" transform="rotate(50 16 16)" fill="rgba(164,100,120,0.12)"/>
  </g>
  <g filter="url(#wc2)">
    <!-- Front petals — smaller, slightly more saturated -->
    <ellipse cx="14" cy="11" rx="3.2" ry="5" transform="rotate(-8 16 16)" fill="rgba(175,90,115,0.22)"/>
    <ellipse cx="20" cy="13" rx="5" ry="2.8" transform="rotate(18 16 16)" fill="rgba(140,110,170,0.20)"/>
    <ellipse cx="12" cy="17" rx="4.5" ry="2.5" transform="rotate(-30 16 16)" fill="rgba(175,90,115,0.18)"/>
    <ellipse cx="18" cy="20" rx="3" ry="4.5" transform="rotate(15 16 16)" fill="rgba(140,110,170,0.17)"/>
  </g>
  <!-- Center pistil — small dark cluster -->
  <circle cx="15.5" cy="15.5" r="2" fill="rgba(100,70,60,0.25)"/>
  <circle cx="16.5" cy="16" r="1.5" fill="rgba(120,80,70,0.20)"/>
  <circle cx="15" cy="16.5" r="1" fill="rgba(90,65,55,0.18)"/>
  <!-- Stamen dots -->
  <circle cx="14" cy="14" r="0.5" fill="rgba(180,150,80,0.30)"/>
  <circle cx="17.5" cy="14.5" r="0.4" fill="rgba(180,150,80,0.25)"/>
  <circle cx="16" cy="18" r="0.45" fill="rgba(180,150,80,0.22)"/>
  <!-- Faint leaf fragment -->
  <ellipse cx="22" cy="24" rx="4" ry="1.8" transform="rotate(35 22 24)" fill="rgba(80,110,70,0.12)"/>
  <line x1="20" y1="25.5" x2="24.5" y2="22.5" stroke="rgba(80,110,70,0.10)" stroke-width="0.4"/>
</svg>
